<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Opening…</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0b0b0f; color: #fafafa;
         font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .box { text-align: center; padding: 2rem; }
  a { color: #818cf8; }
  code { color: #a1a1aa; font-size: 13px; word-break: break-all; }
</style>
</head>
<body>
<div class="box">
  <p id="status">Opening in a new tab…</p>
  <p><a id="fallback" href="https://github.com/rishabhx29">click here</a> if nothing opened</p>
</div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var target = params.get("u");
  var status = document.getElementById("status");
  var fallback = document.getElementById("fallback");

  if (!target) {
    status.textContent = "No destination given.";
    return;
  }

  // Only ever open a web address, never a script or local file scheme.
  var allowed = false;
  try {
    var probe = document.createElement("a");
    probe.href = target;
    allowed = probe.protocol === "http:" || probe.protocol === "https:";
  } catch (err) {
    allowed = false;
  }

  if (!allowed) {
    status.textContent = "That destination is not allowed.";
    return;
  }

  fallback.href = target;

  var opened = window.open(target, "_blank");
  if (opened) {
    try { opened.opener = null; } catch (err) { /* ignore */ }
    window.setTimeout(function () { window.close(); }, 1500);
  } else {
    // The browser blocked the pop-up, so stay in this tab instead of failing.
    status.textContent = "Opening…";
    window.location.replace(target);
  }
})();
</script>
</body>
</html>
